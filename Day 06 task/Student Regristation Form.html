<!DOCTYPE html> <html lang="en"> 
    <head> 
     <meta charset="UTF-8"> 
      <title>Student Registration</title> 
       <style>    
       body { font-family: Arial, sans-serif; max-width: 520px; margin: auto; }  
         fieldset { margin-bottom: 12px; }  
           label { display: block; margin: 8px 0 2px; } 
            </style> 
            </head>
             <body>
                
                <main>  
                    
                    <h1>Student Registration Form</h1> 
                       <form action="#" method="post"> 
                             <fieldset>     
                                   <legend>Personal Details</legend>  
                                         <label for="name">Full Name</label>    
    <input type="text" id="name" name="name" required>  
          <label for="email">Email</label>     
             <input type="email" id="email" name="email" required>      
      <label for="phone">Phone</label>
   <input type="tel" id="phone" name="phone">  
         <label for="dob">Date of Birth</label> 
                <input type="date" id="dob" name="dob">   
                     <label>Gender</label>    
                         <input type="radio" name="gender" value="male"> Male   
             <input type="radio" name="gender" value="female"> Female   
                  <input type="radio" name="gender" value="other"> Other
                      </fieldset>  
                          <fieldset> 
                                   <legend>Course Details</legend>  
                                         <label for="course">Course</label> 
                                                <select id="course" name="course">      
                                                        <option>Python</option>      
                                                            <option>Data Analytics</option>     
                     <option>Full Stack</option>    
                        </select>    
                            <label>Interests</label>    
                                <input type="checkbox" name="interest" value="web"> Web  
                                      <input type="checkbox" name="interest" value="data"> Data 
                                             <input type="checkbox" name="interest" value="ai"> AI    
                                                 <label for="address">Address</label>  
                                                       <textarea id="address" name="address" rows="3" cols="35"></textarea>   
                                                       </fieldset>    
                                                         <button type="submit">Register</button>    
                                                           <button type="reset">Reset</button> 
                                                           </form>
                                                          </main> 
                                                        </body> 
                                                        </html>
